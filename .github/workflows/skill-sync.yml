name: Skill package sync

on:
  push:
    paths:
      - "skills/adaptive-agent-workflow/**"
      - ".agents/skills/adaptive-agent-workflow/**"
      - ".claude/skills/adaptive-agent-workflow/**"
      - "scripts/sync_skills.py"
      - ".github/workflows/skill-sync.yml"
  pull_request:
    paths:
      - "skills/adaptive-agent-workflow/**"
      - ".agents/skills/adaptive-agent-workflow/**"
      - ".claude/skills/adaptive-agent-workflow/**"
      - "scripts/sync_skills.py"
      - ".github/workflows/skill-sync.yml"

permissions:
  contents: read

jobs:
  check-skill-mirrors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Check generated Skill mirrors
        run: python scripts/sync_skills.py --check
