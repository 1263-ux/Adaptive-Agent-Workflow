name: Workflow package checks

on:
  push:
    paths:
      - "skills/adaptive-agent-workflow/**"
      - ".agents/skills/adaptive-agent-workflow/**"
      - ".claude/skills/adaptive-agent-workflow/**"
      - ".codex/hooks.json"
      - ".claude/settings.json"
      - "scripts/**"
      - "tests/**"
      - "docs/**"
      - "hooks/**"
      - ".github/workflows/skill-sync.yml"
  pull_request:
    paths:
      - "skills/adaptive-agent-workflow/**"
      - ".agents/skills/adaptive-agent-workflow/**"
      - ".claude/skills/adaptive-agent-workflow/**"
      - ".codex/hooks.json"
      - ".claude/settings.json"
      - "scripts/**"
      - "tests/**"
      - "docs/**"
      - "hooks/**"
      - ".github/workflows/skill-sync.yml"

permissions:
  contents: read

jobs:
  package-and-hook-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Check generated Skill mirrors
        run: python scripts/sync_skills.py --check
      - name: Validate Python hook syntax
        run: python -m py_compile scripts/adaptive_checkpoint.py
      - name: Test adaptive checkpoint behavior
        run: python -m unittest discover -s tests -v
      - name: Validate host hook JSON
        run: |
          python -c "import json; json.load(open('.codex/hooks.json', encoding='utf-8'))"
          python -c "import json; json.load(open('.claude/settings.json', encoding='utf-8'))"
